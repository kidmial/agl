{{/* internal/webpanel/templates/base.html */}}
{{define "header"}}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGL Analytics</title>
    <link rel="icon"
        href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;path fill='%23f4a261' d='M50 5 L90 27.5 L90 72.5 L50 95 L10 72.5 L10 27.5 Z'/&gt;&lt;/svg&gt;">

    <link rel="stylesheet" href="{{.Prefix}}assets/css/stylesheet.css">
    <script src="{{.Prefix}}assets/js/chart.min.js"></script>
</head>

<body>

    <!-- Скрытый чекбокс для ввтообновления данных -->
    <input type="checkbox" id="autorefresh-switch" class="theme-switch" aria-label="Автообновление телеметрии">
    <!-- Скрытый чекбокс для управления режимом приватности данных -->
    <input type="checkbox" id="privacy-switch" class="theme-switch" aria-label="Режим приватности">
    <!-- Скрытый чекбокс для управления темой -->
    <input type="checkbox" id="theme-switch" class="theme-switch" aria-label="Переключить тему">

    <div class="header">
        <div class="header-brand">
            <span class="logo"><span class="amber">Amber</span>&nbsp;<span class="glab">Guard Laboratory</span></span>
        </div>
        <nav class="nav">
            <a href="{{.Prefix}}dashboard/overview" class="nav-link {{if or (eq .CurrentPagePath "dashboard/overview") (eq .CurrentPagePath "dashboard/profile")}}active{{end}}">Обзор</a>
            <a href="{{.Prefix}}dashboard/vitals" class="nav-link {{if eq .CurrentPagePath "dashboard/vitals"}}active{{end}}">Динамика</a>
            <a href="{{.Prefix}}dashboard/fingerprints" class="nav-link {{if eq .CurrentPagePath "dashboard/fingerprints"}}active{{end}}">Отпечатки</a>
            <a href="{{.Prefix}}dashboard/tarpit" class="nav-link {{if eq .CurrentPagePath "dashboard/tarpit"}}active{{end}}">Алгоритмы</a>
            <a href="{{.Prefix}}dashboard/siem" class="nav-link {{if eq .CurrentPagePath "dashboard/siem"}}active{{end}}">SIEM</a>
            <a href="{{.Prefix}}dashboard/reports" class="nav-link accent {{if eq .CurrentPagePath "dashboard/reports"}}active{{end}}">Отчёты</a>

            <label for="autorefresh-switch" class="nav-link autorefresh-toggle"
                title="Автообновление телеметрии каждые 10 секунд">
                <span class="autorefresh-icon-active" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                        <path d="M21 3v5h-5" />
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                        <path d="M8 16H3v5" />
                    </svg>
                </span>
                <span class="autorefresh-icon-paused" aria-hidden="true" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                        <path d="M21 3v5h-5" />
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                        <path d="M8 16H3v5" />
                        <path d="M 2 2 L 22 22" />
                    </svg>
                </span>
            </label>
            <label for="privacy-switch" class="nav-link privacy-toggle"
                title="Режим приватности: скрыть чувствительные данные для скриншотов">
                <span class="privacy-icon-show" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 8 10 8a10.45 10.45 0 0 0 5.39-1.5" />
                        <line x1="2" x2="22" y1="2" y2="22" />
                    </svg>
                </span>
                <span class="privacy-icon-hide" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </span>
            </label>
            <label for="theme-switch" class="nav-link theme-toggle" title="Переключить тему">
                <!-- Активна тёмная тема -> показываем солнце (чтобы переключить на светлую) -->
                <span class="theme-icon-dark" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4" />
                        <path
                            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
                    </svg>
                </span>
                <!-- Активна светлая тема -> показываем луну (чтобы переключить на тёмную) -->
                <span class="theme-icon-light" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </span>
            </label>

            <a href="{{.Prefix}}logout" class="nav-link danger">Выход</a>
        </nav>
    </div>
    <div class="wrap">
        {{end}}

        {{define "footer"}}

        <script>
            // ==========================================================================
            // GLOBAL CHART MANAGER (AGLCharts)
            // ==========================================================================
            window.AGLCharts = {
                instances: {},

                getThemeColors() {
                    const s = getComputedStyle(document.body);

                    const hexToRgba = (hex, opacity) => {
                        hex = hex.replace(/^#/, '');
                        const r = parseInt(hex.substring(0, 2), 16);
                        const g = parseInt(hex.substring(2, 4), 16);
                        const b = parseInt(hex.substring(4, 6), 16);
                        return `rgba(${r}, ${g}, ${b}, ${opacity})`;
                    };

                    const borderPrimary = s.getPropertyValue('--border-primary').trim();
                    const textMuted = s.getPropertyValue('--text-muted').trim();

                    return {
                        grid: borderPrimary,
                        gridLight: hexToRgba(borderPrimary, 0.9),
                        gridMedium: hexToRgba(borderPrimary, 0.9),

                        text: textMuted,
                        red: s.getPropertyValue('--accent-red').trim(),
                        green: s.getPropertyValue('--accent-green').trim(),
                        blue: s.getPropertyValue('--accent-blue').trim(),
                        amber: s.getPropertyValue('--accent-amber').trim(),
                        purple: s.getPropertyValue('--accent-purple').trim(),
                    };
                },

                createChart(canvasId, type, data, customOptions = {}) {
                    const ctx = document.getElementById(canvasId);
                    if (!ctx) return null;

                    const colors = this.getThemeColors();
                    const defaultOptions = {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { grid: { color: colors.gridLight, drawBorder: false }, ticks: { color: colors.text } },
                            y: { grid: { color: colors.gridLight, drawBorder: false }, ticks: { color: colors.text } }
                        },
                        plugins: { legend: { labels: { color: colors.text } } }
                    };

                    const mergedOptions = {
                        ...defaultOptions,
                        ...customOptions,
                        scales: {
                            x: { ...defaultOptions.scales.x, ...(customOptions.scales?.x || {}) },
                            y: { ...defaultOptions.scales.y, ...(customOptions.scales?.y || {}) }
                        },
                        plugins: {
                            legend: { ...defaultOptions.plugins.legend, ...(customOptions.plugins?.legend || {}) }
                        }
                    };

                    this.instances[canvasId] = new Chart(ctx, { type, data, options: mergedOptions });
                    return this.instances[canvasId];
                },

                // updateData — обновляет данные графика с сохранением пользовательских настроек.
                // Ключевая фича: обновляем только labels и data внутри датасетов,
                // сохраняя все остальные свойства (цвета, fill, tension, hidden-состояние).
                // Это позволяет:
                // - пользователю свободно включать/выключать легенду;
                // - всплывающим подсказкам работать корректно (метаданные сохраняются).
                updateData(canvasId, newData) {
                    const chart = this.instances[canvasId];
                    if (!chart) return;

                    // 1. Обновляем labels (если они изменились)
                    if (newData.labels) {
                        chart.data.labels = newData.labels;
                    }

                    // Обновляем данные датасетов инкрементально (без потери метаданных)
                    if (newData.datasets) {
                        newData.datasets.forEach((newDataset, i) => {
                            if (chart.data.datasets[i]) {
                                // Обновляем ТОЛЬКО поле data, сохраняя все остальные свойства датасета
                                // (цвета, fill, tension, hidden-состояние и т.д.)
                                chart.data.datasets[i].data = newDataset.data;
                            }
                        });
                    }

                    // Обновляется без анимации (тихое обновление)
                    chart.update('none');
                },

                updateAllThemes() {
                    const colors = this.getThemeColors();
                    Object.values(this.instances).forEach(chart => {
                        chart.options.scales.x.grid.color = colors.gridLight;
                        chart.options.scales.y.grid.color = colors.gridLight;
                        chart.options.scales.x.ticks.color = colors.text;
                        chart.options.scales.y.ticks.color = colors.text;
                        chart.options.plugins.legend.labels.color = colors.text;
                        chart.update('none');
                    });
                },

                init() {
                    document.getElementById('theme-switch')?.addEventListener('change', () => {
                        this.updateAllThemes();
                    });
                }
            };

            document.addEventListener('DOMContentLoaded', () => {
                window.AGLCharts.init();
            });

            // ==========================================================================
            // THEME PERSISTENCE
            // ==========================================================================
            (function () {
                const checkbox = document.getElementById('theme-switch');
                const savedTheme = localStorage.getItem('agl_theme');
                if (savedTheme === 'light') checkbox.checked = true;

                checkbox.addEventListener('change', function () {
                    localStorage.setItem('agl_theme', this.checked ? 'light' : 'dark');
                });
            })();

            // ==========================================================================
            // AUTO-REFRESH (живые страницы)
            // ==========================================================================
            (function () {
                const AUTOREFRESH_INTERVAL = 10000; // 10 секунд
                const cb = document.getElementById('autorefresh-switch');

                // Восстановление состояния
                if (localStorage.getItem('agl_autorefresh') === 'off') {
                    cb.checked = false;
                } else {
                    cb.checked = true; // по умолчанию ВКЛ
                }

                cb.addEventListener('change', function () {
                    localStorage.setItem('agl_autorefresh', this.checked ? 'on' : 'off');
                    updateAutorefreshUI();
                    if (this.checked) {
                        startAutorefresh();
                    } else {
                        stopAutorefresh();
                    }
                });

                let autorefreshTimer = null;

                function updateAutorefreshUI() {
                    const active = document.querySelector('.autorefresh-icon-active');
                    const paused = document.querySelector('.autorefresh-icon-paused');
                    const toggle = document.querySelector('.autorefresh-toggle');

                    if (cb.checked) {
                        active.style.display = 'inline';
                        paused.style.display = 'none';
                        toggle.style.color = 'var(--accent-green)';
                    } else {
                        active.style.display = 'none';
                        paused.style.display = 'inline';
                        toggle.style.color = 'var(--accent-amber)';
                    }

                    // Обновляем статус в dashboard_overview
                    const statusEl = document.getElementById('autorefresh-status');
                    if (statusEl) {
                        statusEl.textContent = cb.checked ? 'активно (10 сек)' : 'пауза';
                        statusEl.className = cb.checked ? 'text-green' : 'text-amber';
                    }
                }

                function startAutorefresh() {
                    if (autorefreshTimer) clearInterval(autorefreshTimer);
                    autorefreshTimer = setInterval(() => {
                        // Пауза когда вкладка не видна
                        if (document.visibilityState !== 'visible') return;
                        // Триггер события для подписчиков (dashboard_vitals, dashboard_overview)
                        window.dispatchEvent(new CustomEvent('agl:autorefresh'));
                    }, AUTOREFRESH_INTERVAL);
                }

                function stopAutorefresh() {
                    if (autorefreshTimer) {
                        clearInterval(autorefreshTimer);
                        autorefreshTimer = null;
                    }
                }

                updateAutorefreshUI();
                if (cb.checked) startAutorefresh();
            })();

            // ==========================================================================
            // Визуальный фидбек автообновления (Event-driven)
            // ==========================================================================
            window.addEventListener('agl:autorefresh', () => {
                // Находим активную иконку (ту, которая видна)
                const activeIcon = document.querySelector('.autorefresh-icon-active');
                const pausedIcon = document.querySelector('.autorefresh-icon-paused');
                
                // Определяем, какая иконка сейчас видна
                let targetIcon = null;
                if (activeIcon && activeIcon.style.display !== 'none') {
                    targetIcon = activeIcon;
                } else if (pausedIcon && pausedIcon.style.display !== 'none') {
                    targetIcon = pausedIcon;
                }
                
                if (!targetIcon) return;
                
                // Если анимация уже запущена, просто перезапускаем её через reflow
                if (targetIcon.classList.contains('pulse')) {
                    targetIcon.classList.remove('pulse');
                    void targetIcon.offsetWidth; // reflow
                    targetIcon.classList.add('pulse');
                    return;
                }
                
                // Добавляем класс с анимацией
                targetIcon.classList.add('pulse');
                
                // Слушаем завершение анимации
                const handleAnimationEnd = () => {
                    targetIcon.classList.remove('pulse');
                    targetIcon.removeEventListener('animationend', handleAnimationEnd);
                };
                
                targetIcon.addEventListener('animationend', handleAnimationEnd);
            });

            // ==========================================================================
            // МЕНЕДЖЕР РЕЖИМА ПРИВАТНОСТИ (Secure by Default)
            // ==========================================================================
            (function () {
                // 1. МГНОВЕННОЕ определение состояния (выполняется до отрисовки любых графиков)
                const savedState = localStorage.getItem('agl_privacy');
                // По умолчанию ВКЛ (true), если только пользователь явно не сохранил 'off'
                let isPrivacyActive = (savedState !== 'off');

                // Делаем функцию-обертку, которая читает эту мгновенную переменную, а не лезет в DOM
                window.isAglPrivacyOn = function() {
                    return isPrivacyActive;
                };

                // 2. НЕМЕДЛЕННАЯ подмена глобальных настроек Chart.js 
                const blurText = '•••'; 
                
                ['linear', 'logarithmic', 'category', 'time'].forEach(scaleType => {
                    if (Chart.defaults.scales[scaleType] && Chart.defaults.scales[scaleType].ticks) {
                        const originalCallback = Chart.defaults.scales[scaleType].ticks.callback;
                        
                        Chart.defaults.scales[scaleType].ticks.callback = function(value, index, ticks) {
                            // Проверяем мгновенную переменную, а не состояние DOM-элемента
                            if (isPrivacyActive) {
                                return blurText;
                            }
                            if (typeof originalCallback === 'function') {
                                return originalCallback.call(this, value, index, ticks);
                            }
                            return value;
                        };
                    }
                });

                // 3. Инициализация UI при загрузке DOM (теперь она только синхронизирует интерфейс)
                document.addEventListener('DOMContentLoaded', () => {
                    const cb = document.getElementById('privacy-switch');
                    if (!cb) return;

                    // Синхронизируем галочку с тем состоянием, которое мы уже решили использовать
                    cb.checked = isPrivacyActive;

                    // Слушатель переключения
                    cb.addEventListener('change', function () {
                        // Обновляем мгновенную переменную
                        isPrivacyActive = this.checked;
                        localStorage.setItem('agl_privacy', isPrivacyActive ? 'on' : 'off');
                        
                        // Мгновенное обновление всех существующих графиков без анимации
                        if (typeof Chart !== 'undefined' && Chart.instances) {
                            Object.values(Chart.instances).forEach(chart => {
                                chart.update('none');
                            });
                        }
                    });
                });
            })();

            // ==========================================================================
            // UTILITY FUNCTIONS
            // ==========================================================================
            function rebuildHistory() {
                const btn = document.getElementById('rebuildBtn');
                const status = document.getElementById('rebuildStatus');
                if (!btn || !status) return;

                btn.disabled = true;
                btn.textContent = 'Загрузка...';
                status.textContent = 'Чтение файла лога...';
                status.className = 'control-status';

                const pathParts = window.location.pathname.split('/');
                const prefix = pathParts[1] ? pathParts[1] + '/' : '';

                fetch('/' + prefix + 'api/rebuild', { method: 'POST' })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            btn.textContent = 'История загружена';
                            status.textContent = `${data.valid} событий загружено (${data.broken} битых строк пропущено). Перезапустите сервис.`;
                            status.className = 'control-status success';
                            setTimeout(() => window.location.reload(), 2000);
                        } else {
                            btn.disabled = false;
                            btn.textContent = 'Загрузить историю из лога';
                            status.textContent = data.reason || data.error || 'Ошибка загрузки';
                            status.className = 'control-status error';
                        }
                    })
                    .catch(err => {
                        btn.disabled = false;
                        btn.textContent = 'Загрузить историю из лога';
                        status.textContent = 'Ошибка сети: ' + err.message;
                        status.className = 'control-status error';
                    });
            }

            // =====
            // AGL |
            // =====
            const aglWatermarkPlugin = {
                id: 'aglWatermark',
                afterDraw: (chart, args, options) => {
                    const { ctx, chartArea } = chart;
                    if (!chartArea) return;

                    ctx.save();
                    
                    ctx.globalAlpha = 0.3;
                    
                    ctx.font = 'bold 15px "JetBrains Mono", monospace';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'top';
                    
                    const x = chartArea.right - 12;
                    const y = chartArea.top + 12;

                    ctx.fillStyle = '#aaaaaa'; 
                    ctx.fillText('GL', x, y);

                    const widthGL = ctx.measureText('GL').width;
                    
                    ctx.fillStyle = '#f90';
                    ctx.fillText('A', x - widthGL, y);
                    
                    ctx.restore();
                }
            };

            if (typeof Chart !== 'undefined') {
                Chart.register(aglWatermarkPlugin);
            }
        </script>
    </div>
    <footer class="status-bar">
        <div class="version-signature">
            <div class="agl-footer"><span class="amber">A</span><span class="glab">GL</span></div>
            <div class="build-version">{{.Version}}</div>
        </div>
    </footer>
</body>

</html>
{{end}}
